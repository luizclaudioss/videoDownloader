<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Radar — Baixador & Conversor MP4 (.m3u8 ➔ .mp4)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 { font-size: 20px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    input, select {
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      width: 100%;
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #334155; }
    .progress-wrap {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      transition: width 0.2s ease;
    }
    .status-text { font-size: 13px; color: #cbd5e1; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>⬇️ Baixador & Conversor MP4 (.m3u8 ➔ .mp4)</h1>
      <p class="sub">Baixa todos os segmentos do vídeo com Referer autenticado e converte automaticamente para arquivo <strong>.MP4</strong>.</p>
    </div>

    <div class="field">
      <label>Nome do Arquivo Final (.mp4)</label>
      <input id="titleInput" type="text" />
    </div>

    <div class="field">
      <label>URL da Playlist (.m3u8)</label>
      <input id="urlInput" type="text" readonly />
    </div>

    <div id="variantField" class="field" style="display: none;">
      <label>Qualidade / Resolução detectada na Master Playlist</label>
      <select id="variantSelect"></select>
    </div>

    <div class="btn-row">
      <button id="btnStartDownload">🚀 Baixar e Converter para .MP4</button>
      <button id="btnCopyYtdlp" class="btn-secondary">💻 Copiar comando yt-dlp</button>
      <button id="btnCopyFfmpeg" class="btn-secondary">🎬 Copiar comando ffmpeg</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <div id="statusText" class="status-text">Analisando manifesto .m3u8...</div>
    </div>
  </div>

  <script src="lib/mux.min.js"></script>
  <script src="hls-downloader.js"></script>
</body>
</html>
